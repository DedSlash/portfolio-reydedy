<!doctype html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <title>Rey Dedy Pangou — Développeur Fullstack Java/Spring/Angular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio de Rey Dedy Pangou — développeur fullstack Java/Spring/Angular à Dakar. Microservices, SaaS en production, architectures solides.">
  <meta name="theme-color" content="#07070b">

  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts : Fraunces (titres) + Inter (corps) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Évite le flash blanc au chargement : applique le thème avant le rendu -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = saved || (prefersLight ? 'light' : 'dark');
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(theme);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
