# Site statique — pas de build step
# Netlify publie directement les fichiers HTML/CSS/JS/img depuis la racine.
[build]
  publish = "."

# URLs propres : /realisations → /realisations.html, etc.
# Ne pas ajouter de fallback SPA — c'est un site multi-pages.

# Cache long sur les assets statiques (images, CV, JS partagé)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# En-têtes de sécurité minimaux
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
