<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 500" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Architecture microservices de Joseph Yusuf</title>
  <desc>Plateforme SaaS distribuee : passerelle API, 10 microservices Spring Boot communiquant via Kafka, bases PostgreSQL et MongoDB, chaine CI/CD et pile d'observabilite.</desc>
  <defs>
    <marker id="jy-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="500" rx="16" fill="#07070b"/>

  <text x="32" y="40" fill="#c9a84c" font-size="19" font-weight="600" font-family="'Fraunces', Georgia, serif">Joseph Yusuf — architecture en production</text>
  <text x="32" y="62" fill="#8a8a93" font-size="13">Plateforme SaaS de gestion de revenus · système distribué</text>

  <!-- Gateway -->
  <rect x="32" y="84" width="616" height="46" rx="8" fill="#12121a" stroke="#c9a84c" stroke-width="1"/>
  <text x="340" y="104" fill="#e8e4d8" font-size="14" font-weight="600" text-anchor="middle">Passerelle API · Spring Cloud Gateway</text>
  <text x="340" y="121" fill="#8a8a93" font-size="12" text-anchor="middle">Routage · JWT / OAuth2 · Spring Security</text>

  <line x1="150" y1="158" x2="150" y2="132" stroke="#c9a84c" stroke-width="1.2" marker-end="url(#jy-arrow)"/>
  <line x1="530" y1="158" x2="530" y2="132" stroke="#c9a84c" stroke-width="1.2" marker-end="url(#jy-arrow)"/>

  <!-- Kafka -->
  <rect x="32" y="158" width="616" height="40" rx="8" fill="#1a160e" stroke="#c9a84c" stroke-width="0.8"/>
  <text x="340" y="182" fill="#d9b95c" font-size="14" font-weight="600" text-anchor="middle">Apache Kafka · bus d'événements</text>

  <line x1="340" y1="130" x2="340" y2="158" stroke="#5a5a63" stroke-width="1" marker-end="url(#jy-arrow)"/>

  <!-- Microservices row -->
  <g fill="#101019" stroke="#2e2e3a" stroke-width="0.8">
    <rect x="32" y="224" width="146" height="54" rx="8"/>
    <rect x="190" y="224" width="146" height="54" rx="8"/>
    <rect x="348" y="224" width="146" height="54" rx="8"/>
    <rect x="502" y="224" width="146" height="54" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="105" y="246" fill="#e8e4d8" font-size="14" font-weight="600">Comptes</text>
    <text x="105" y="264" fill="#8a8a93" font-size="12">Utilisateurs · auth</text>
    <text x="263" y="246" fill="#e8e4d8" font-size="14" font-weight="600">Revenus</text>
    <text x="263" y="264" fill="#8a8a93" font-size="12">Flux variables</text>
    <text x="421" y="246" fill="#e8e4d8" font-size="14" font-weight="600">Transactions</text>
    <text x="421" y="264" fill="#8a8a93" font-size="12">Encaissements</text>
    <text x="575" y="246" fill="#e8e4d8" font-size="14" font-weight="600">+ 7 services</text>
    <text x="575" y="264" fill="#8a8a93" font-size="12">Notif · reporting…</text>
  </g>
  <g stroke="#5a5a63" stroke-width="1" marker-end="url(#jy-arrow)">
    <line x1="105" y1="224" x2="105" y2="198"/>
    <line x1="263" y1="224" x2="263" y2="198"/>
    <line x1="421" y1="224" x2="421" y2="198"/>
    <line x1="575" y1="224" x2="575" y2="198"/>
  </g>

  <!-- Databases -->
  <rect x="32" y="304" width="300" height="52" rx="8" fill="#0e1613" stroke="#3a5a4a" stroke-width="0.8"/>
  <text x="182" y="325" fill="#8fd0b0" font-size="14" font-weight="600" text-anchor="middle">PostgreSQL</text>
  <text x="182" y="343" fill="#7a8a82" font-size="12" text-anchor="middle">Données transactionnelles</text>

  <rect x="348" y="304" width="300" height="52" rx="8" fill="#0e1613" stroke="#3a5a4a" stroke-width="0.8"/>
  <text x="498" y="325" fill="#8fd0b0" font-size="14" font-weight="600" text-anchor="middle">MongoDB</text>
  <text x="498" y="343" fill="#7a8a82" font-size="12" text-anchor="middle">Documents · historiques</text>

  <g stroke="#5a5a63" stroke-width="1" marker-end="url(#jy-arrow)">
    <line x1="182" y1="304" x2="182" y2="278"/>
    <line x1="498" y1="304" x2="498" y2="278"/>
  </g>

  <!-- CI/CD + Observability -->
  <rect x="32" y="384" width="300" height="56" rx="8" fill="#1a160e" stroke="#5a4a2a" stroke-width="0.8"/>
  <text x="182" y="406" fill="#d9b95c" font-size="14" font-weight="600" text-anchor="middle">CI/CD</text>
  <text x="182" y="424" fill="#a89870" font-size="12" text-anchor="middle">Jenkins · Ansible · Docker</text>

  <rect x="348" y="384" width="300" height="56" rx="8" fill="#1a0e0e" stroke="#5a3030" stroke-width="0.8"/>
  <text x="498" y="406" fill="#d68a7a" font-size="14" font-weight="600" text-anchor="middle">Observabilité</text>
  <text x="498" y="424" fill="#a87a70" font-size="12" text-anchor="middle">Prometheus · Grafana · Loki</text>

  <text x="32" y="468" fill="#6a6a73" font-size="12">Déployé sur Hetzner VPS · sécurité de bout en bout (Vault, OAuth2)</text>
</svg>
